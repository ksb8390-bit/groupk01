{% extends 'base.html' %}
{% block body %}
<section class="card narrow">
  <h1>비밀번호 변경</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>현재 비밀번호<input name="current" type="password" required></label>
    <label>새 비밀번호 (8자 이상)<input name="new" type="password" minlength="8" required></label>
    <label>새 비밀번호 확인<input name="new2" type="password" minlength="8" required></label>
    <button class="btn primary wide">변경</button>
  </form>
</section>
{% endblock %}
